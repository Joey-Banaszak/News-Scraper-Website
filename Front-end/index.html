<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Scraper</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-default navbar-fixed-top">
    <div class="container-fluid">
      <div class="navbar-header">
        <a class="navbar-brand" href="/">News Scraper</a>
      </div>
      <ul class="nav navbar-nav navbar-right">
        <li><a href="#">About</a></li>
      </ul>
    </div>
  </nav>
  
  <div class="container-main">
    <div class="container-search">
      <h1>Welcome to the News Scraper</h1>
      <p>Find news stories that are relevant to you!</p>
      <form method="GET" action="/search.html">
        <div class="input-group">
          <input type="text" name="q" id="search-box" class="form-control" placeholder="Search">
          <span class="input-group-btn">
            <button class="btn btn-default" type="submit">Search</button>
            <button class="btn btn-secondary" id="prev-search-btn" type="button">Previous Searches</button>
          </span>
        </div>
      </form>

      <!-- previous searches -->
      <ul id="previous-searches" class="dropdown-menu"></ul>
    </div>
  </div>

  <!-- create event handler -->>
  <script>
    $(document).ready(function() {
      // Initialize the event-driven handlers
      initEventHandlers();
    });

    function initEventHandlers() {
      // Handler for Previous Searches button
      $('#prev-search-btn').on('click', function() {
        fetchPreviousSearches();
      });

    }

    function fetchPreviousSearches() {
      // AJAX request to fetch previous searches
      $.ajax({
        url: '/get_previous_searches',
        method: 'GET',
        success: handlePreviousSearchesResponse,
        error: function() {
          console.error("Error fetching previous searches.");
        }
      });
    }

    // create event listener/ handler 
    function handlePreviousSearchesResponse(data) {
      let searchList = $('#previous-searches');
      searchList.empty(); 
      
      if (data.length > 0) {
        data.forEach(function(searchTerm) {
          searchList.append('<li><a href="#">' + searchTerm + '</a></li>');
        });
      } else {
        searchList.append('<li>No previous searches found.</li>');
      }
      searchList.show(); 
    }
  </script>
</body>
</html>
